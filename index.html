<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101311" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-title" content="Daymark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Daymark is a private, local-first habit app with automatic phone and laptop sync." />
    <meta property="og:title" content="Daymark" />
    <meta property="og:description" content="A quiet record of showing up." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://harsh.bet/daymark/" />
    <meta property="og:image" content="https://harsh.bet/daymark/social-card.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://harsh.bet/daymark/" />
    <link rel="icon" type="image/svg+xml" href="/daymark/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/daymark/apple-touch-icon.png" />
    <link rel="manifest" href="/daymark/manifest.webmanifest" />
    <title>Daymark</title>
    <script>
      // Same resolver as the harsh.bet landing page, on Daymark's own key: an
      // explicit Dark/Light choice wins, and no stored choice follows the OS.
      // Runs before paint because the tracker state loads asynchronously.
      (() => {
        try {
          const savedTheme = localStorage.getItem('daymark-theme');
          const theme = savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', theme === 'light' ? '#f2f3ed' : '#101311');
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Daymark needs JavaScript enabled to store, sync, and review habit entries.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
